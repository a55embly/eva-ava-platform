[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aitegrate-enterprise-chatbot"
version = "0.1.0"
description = "Reusable enterprise chatbot platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "httpx",
  "pgvector",
  "psycopg[binary]",
  "pydantic-settings",
  "sqlalchemy",
  "uvicorn",
]

[project.optional-dependencies]
dev = [
  "mypy",
  "pytest",
  "pytest-asyncio",
  "pyyaml==6.0.3",
  "ruff",
  "types-pyyaml==6.0.12.20260518",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
